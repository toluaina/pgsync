name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements/dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements/dev.txt

    - name: Run lint checks
      run: ./scripts/lint.sh

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.14"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build distributions
      run: python -m build

    - name: Check distributions
      run: python -m twine check dist/*

  test-postgres:
    name: PostgreSQL / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: debezium/postgres@sha256:03d929e57939508a518e36b14a292f78a675c22fe1db4d63beb8777c968002c4
        env:
          POSTGRES_DB: testdb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis@sha256:1c4405ec7fb6ed58b6b83d26c7e3fc80625d2aca6cfa517ae03b6e963510f7ca
        ports:
          - 6379:6379
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
        ports:
          - 9200:9200
          - 9300:9300
        env:
          xpack.security.enabled: false
          network.host: 127.0.0.1
          http.host: 0.0.0.0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements/dev.txt

    - name: Install project and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . -r requirements/dev.txt

    - name: Test with pytest
      run: pytest -x -s -vv --cov=pgsync --cov-report=xml:tests/coverage.xml --cov-report=term-missing
      env:
        ELASTICSEARCH_HOST: localhost
        ELASTICSEARCH_PORT: 9200
        ELASTICSEARCH_SCHEME: http
        PG_HOST: localhost
        PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        PG_PASSWORD: postgres
        PG_USER: postgres
        REDIS_CHECKPOINT: false

    - name: Upload PostgreSQL coverage
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: tests/coverage.xml
        flags: postgres
        name: postgres-python-${{ matrix.python-version }}
        fail_ci_if_error: false

  test-mariadb:
    name: MariaDB / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      mariadb:
        image: mariadb@sha256:e564bcaefb87c3d2b8b09b539ea791d34f4b62c05e2e7cb03f5d6388bdc54f2c
        env:
          MARIADB_DATABASE: testdb
          MARIADB_USER: mysql
          MARIADB_PASSWORD: mysql
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
      redis:
        image: redis@sha256:1c4405ec7fb6ed58b6b83d26c7e3fc80625d2aca6cfa517ae03b6e963510f7ca
        ports:
          - 6379:6379
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
        ports:
          - 9200:9200
          - 9300:9300
        env:
          xpack.security.enabled: false
          network.host: 127.0.0.1
          http.host: 0.0.0.0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements/dev.txt

    - name: Install project and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . -r requirements/dev.txt

    - name: Test with pytest
      run: pytest -x -s -vv --cov=pgsync --cov-report=xml:tests/coverage.xml --cov-report=term-missing
      env:
        ELASTICSEARCH_HOST: localhost
        ELASTICSEARCH_PORT: 9200
        ELASTICSEARCH_SCHEME: http
        PG_HOST: localhost
        PG_PORT: ${{ job.services.mariadb.ports['3306'] }}
        PG_PASSWORD: mysql
        PG_USER: mysql
        PG_DRIVER: pymysql
        REDIS_CHECKPOINT: false

    - name: Upload MariaDB coverage
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: tests/coverage.xml
        flags: mariadb
        name: mariadb-python-${{ matrix.python-version }}
        fail_ci_if_error: false
